<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Strike VR</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb}
canvas{display:block}
#menu{position:fixed;inset:0;background:#17202ddd;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center}
button{padding:15px 22px;margin:8px;border:0;border-radius:8px;background:#36b653;color:white;font-size:18px}
#hud{position:fixed;top:12px;left:12px;color:white;font-weight:bold;text-shadow:2px 2px black;z-index:2}
#shoot{position:fixed;right:20px;bottom:25px;background:#c33}
#move{position:fixed;left:20px;bottom:25px}
</style>
</head>
<body>
<div id="menu">
<h1>RETRO STRIKE VR</h1>
<p>FPS muito foda para Meta Quest 2</p>
<button id="play">JOGAR</button>
<button id="vr">ENTRAR EM VR</button>
<p id="message">Prepare-se para o combate!</p>
</div>
<div id="hud">VIDA: 100 | ABATES: <span id="kills">0</span></div>
<button id="shoot">ATIRAR</button>
<button id="move">ANDAR</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 100);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 150);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x52613a, 2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(10,20,10);
scene.add(sun);

const player = new THREE.Group();
player.position.set(0,0,5);
scene.add(player);
player.add(camera);
camera.position.set(0,1.7,0);

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x496b3b})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

function box(x,y,z,w,h,d,color){
 const m = new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 m.position.set(x,y,z);
 scene.add(m);
 return m;
}

for(let i=0;i<8;i++){
 const x=(i%4)*13-19;
 const z=-12-Math.floor(i/4)*18;
 box(x,1.5,z,6,3,6,0x777777);
 box(x,3.1,z,6.4,.3,6.4,0x353535);
}

for(let i=0;i<30;i++){
 const x=Math.random()*70-35, z=-Math.random()*70;
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.2,.3,2),
  new THREE.MeshStandardMaterial({color:0x654328})
 );
 trunk.position.set(x,1,z);
 scene.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1.5,3,7),
  new THREE.MeshStandardMaterial({color:0x24572a})
 );
 leaves.position.set(x,3,z);
 scene.add(leaves);
}

const gun = new THREE.Mesh(
 new THREE.BoxGeometry(.18,.18,.65),
 new THREE.MeshStandardMaterial({color:0x252525,metalness:.6})
);
gun.position.set(.28,-.25,-.55);
camera.add(gun);

const enemies=[];
let kills=0, started=false, moving=false;

function spawnEnemy(){
 const e=new THREE.Group();
 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.7,1.2,.5),
  new THREE.MeshStandardMaterial({color:0x9d2929})
 );
 body.position.y=1;
 e.add(body);
 const head=new THREE.Mesh(
  new THREE.BoxGeometry(.45,.45,.45),
  new THREE.MeshStandardMaterial({color:0xc9a27b})
 );
 head.position.y=1.85;
 e.add(head);
 e.position.set(Math.random()*24-12,0,-Math.random()*35-8);
 scene.add(e);
 enemies.push(e);
}
for(let i=0;i<8;i++)spawnEnemy();

function shoot(){
 if(!started)return;
 const origin=new THREE.Vector3();
 const dir=new THREE.Vector3();
 camera.getWorldPosition(origin);
 camera.getWorldDirection(dir);
 const ray=new THREE.Raycaster(origin,dir,0,60);
 const meshes=[];
 for(const e of enemies)e.traverse(o=>{if(o.isMesh)meshes.push(o)});
 const hits=ray.intersectObjects(meshes);
 if(hits.length){
  let target=hits[0].object;
  while(target.parent&&!enemies.includes(target))target=target.parent;
  if(enemies.includes(target)){
   scene.remove(target);
   enemies.splice(enemies.indexOf(target),1);
   kills++;
   document.getElementById('kills').textContent=kills;
   spawnEnemy();
  }
 }
}

const left=renderer.xr.getController(0);
const right=renderer.xr.getController(1);
scene.add(left,right);
left.addEventListener('selectstart',shoot);
right.addEventListener('selectstart',shoot);

function updateVR(){
 if(!started||!renderer.xr.isPresenting)return;
 const session=renderer.xr.getSession();
 if(!session)return;
 for(const source of session.inputSources){
  if(source.handedness!=='left'||!source.gamepad)continue;
  const a=source.gamepad.axes;
  let x=a[0]||0,y=a[1]||0;
  if(a.length>=4&&(Math.abs(a[2])>Math.abs(x)||Math.abs(a[3])>Math.abs(y))){x=a[2];y=a[3]}
  if(Math.abs(x)<.15)x=0;
  if(Math.abs(y)<.15)y=0;
  const f=new THREE.Vector3();
  camera.getWorldDirection(f);f.y=0;f.normalize();
  const r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize();
  player.position.addScaledVector(f,-y*.08);
  player.position.addScaledVector(r,x*.08);
 }
}

document.getElementById('play').onclick=()=>{
 started=true;
 document.getElementById('menu').style.display='none';
};
document.getElementById('vr').onclick=async()=>{
 try{
  const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
  await renderer.xr.setSession(session);
  started=true;
  document.getElementById('menu').style.display='none';
 }catch(e){
  document.getElementById('message').textContent='Erro VR: '+e.message;
 }
};
document.getElementById('shoot').onclick=shoot;
document.getElementById('move').onpointerdown=()=>moving=true;
document.getElementById('move').onpointerup=()=>moving=false;
document.getElementById('move').onpointerleave=()=>moving=false;

renderer.setAnimationLoop(()=>{
 updateVR();
 if(started&&moving&&!renderer.xr.isPresenting){
  const f=new THREE.Vector3();
  camera.getWorldDirection(f);f.y=0;f.normalize();
  player.position.addScaledVector(f,.08);
 }
 renderer.render(scene,camera);
});

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
